<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCE Office Booking</title>
<style>
  :root {
    --flamingo: #FFB6DD; --flamingo-soft: #FFD0E7; --flamingo-deep: #FF8FC8;
    --clementine: #FF3D0A; --clementine-deep: #E02E00;
    --lime-soft: #F2FCB8; --ink: #0A0A0A; --paper: #FFFFFF; --paper-warm: #FAF7F2;
    --n-700: #333; --n-600: #555; --n-500: #808080; --n-400: #B5B5B5; --n-200: #EAEAEA; --n-100: #F4F4F4;
    --bg: var(--paper-warm); --surface: var(--paper); --text: var(--ink);
    --text-muted: var(--n-600); --text-faint: var(--n-500);
    --taken: var(--n-100); --taken-text: var(--n-700);
    --danger: var(--clementine); --radius: 0px; --radius-pill: 999px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: #CCF000; color: var(--ink); }
  .app { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }
  .header { display: grid; grid-template-columns: minmax(180px,1fr) minmax(280px,1.5fr) minmax(220px,1fr); align-items: start; gap: 32px; margin-bottom: 30px; }
  .header-col { display: flex; flex-direction: column; }
  .header-brand { gap: 16px; }
  .header-datetime { display: flex; flex-direction: column; }
  .header-date { font-family: var(--font-display); font-size: 21px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.15; }
  .header-time-row { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
  .header-time { font-size: 14px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; }
  .header-time-source { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .header-notices { margin-top: 16px; display: flex; flex-direction: column; gap: 5px; }
  .header-notice-item { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .header-notice-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--flamingo-deep); flex-shrink: 0; }
  .header-notice-day { font-weight: 800; color: var(--ink); flex-shrink: 0; }
  .header-month { gap: 10px; padding-top: 4px; }
  .month-cal-topline { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .month-cal-title { font-family: var(--font-display); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .month-cal-key { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); flex-wrap: wrap; }
  .month-cal-key-item { display: flex; align-items: center; gap: 5px; }
  .month-cal-key-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .month-cal-key-dot.dot-booked { background: var(--flamingo-deep); }
  .month-cal-key-dot.dot-overflow { background: #9FD63C; }
  .month-cal-key-dot.dot-full { background: var(--clementine); }
  .month-cal-dow { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; }
  .month-cal-dow span { font-size: 10px; font-weight: 800; color: var(--text-faint); }
  .month-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .month-cal-cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
  .month-cal-cell.blank { visibility: hidden; cursor: default; }
  .month-cal-cell.today { border: 2px solid var(--clementine); color: var(--ink); }
  .month-cal-cell:not(.blank):hover .month-cal-dot { outline: 2px solid var(--ink); outline-offset: 1px; }
  .month-cal-dot { display: flex; align-items: center; justify-content: center; width: 1.7em; height: 1.7em; border-radius: 50%; }
  .month-cal-dot.booked { background: var(--flamingo-deep); color: var(--ink); }
  .month-cal-dot.overflow-booked { background: #9FD63C; color: var(--ink); }
  .month-cal-dot.full { background: var(--clementine); color: var(--paper); }
  .header-account { align-items: flex-end; gap: 12px; }
  .bulk-btn { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 14px; border: 2px solid var(--ink); background: var(--surface); border-radius: var(--radius-pill); cursor: pointer; transition: background 120ms, color 120ms, border-color 120ms; white-space: nowrap; }
  .bulk-btn:hover { background: var(--ink); color: var(--paper); }
  .bulk-btn-danger:hover { background: var(--clementine); border-color: var(--clementine); color: var(--paper); }
  .user-pill-compact { padding: 6px 10px; gap: 8px; }
  .user-pill-compact .user-avatar { width: 26px; height: 26px; font-size: 11px; }
  .user-pill-compact .user-email { display: none; }
  .user-pill-compact .user-name { font-size: 12px; }

  .user-pill { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--ink); padding: 8px 14px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); background: var(--flamingo); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; overflow: hidden; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 13px; font-weight: 700; }
  .user-email { font-size: 11px; color: var(--text-muted); }
  .signout-btn { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); background: none; border: none; cursor: pointer; margin-left: 8px; transition: color 120ms; }
  .signout-btn:hover { color: var(--clementine); }
  .holidays-widget { width: 100%; margin-top: 10px; border: 2px solid var(--ink); background: var(--surface); padding: 8px 12px; }
  .holidays-section + .holidays-section { margin-top: 8px; }
  .holidays-title { font-family: var(--font-display); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
  .holidays-chevron { display: inline-block; font-size: 8px; transition: transform 120ms; }
  .holidays-title.collapsed .holidays-chevron { transform: rotate(-90deg); }
  .holiday-items.collapsed { display: none; }
  .holiday-item { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; font-size: 12px; }
  .holiday-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .holiday-until { color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .week-nav button:not(.today-btn):not(.bulk-btn) { width: 38px; height: 38px; border: 2px solid var(--ink); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; transition: background 120ms; }
  .week-nav button:not(.today-btn):not(.bulk-btn):hover { background: var(--flamingo); }
  .week-nav button:not(.today-btn):not(.bulk-btn):disabled { opacity: 0.3; cursor: not-allowed; }
  .week-label { font-family: var(--font-display); font-size: 17px; font-weight: 700; text-transform: uppercase; min-width: 220px; }
  .today-btn { margin-left: auto; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 18px; border: 2px solid var(--ink); background: var(--surface); border-radius: var(--radius-pill); cursor: pointer; transition: background 120ms, color 120ms; }
  .today-btn:hover { background: var(--ink); color: var(--paper); }
  .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .day-card { background: var(--surface); border: 2px solid var(--ink); overflow: hidden; display: flex; flex-direction: column; transition: opacity 150ms; }
  .day-card.loading-state { opacity: 0.5; pointer-events: none; }
  .day-card.today { border-color: var(--clementine); box-shadow: inset 0 0 0 2px var(--clementine); }
  .day-card.jump-highlight { box-shadow: 0 0 0 3px var(--clementine); transition: box-shadow 200ms; }
  .day-header { padding: 12px 14px 10px; border-bottom: 2px solid var(--ink); }
  .day-card.today .day-header { border-bottom-color: var(--clementine); }
  .day-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
  .day-card.today .day-name { color: var(--clementine); }
  .day-date { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1.1; margin-top: 2px; }
  .day-card.today .day-date { color: var(--clementine); }
  .desk-count { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 5px; }
  .desk-count.full { color: var(--clementine); }
  .social-events { padding: 6px 10px; background: var(--flamingo-soft); border-bottom: 2px solid var(--ink); }
  .social-event { display: flex; align-items: center; gap: 7px; padding: 2px 0; font-size: 12px; font-weight: 600; }
  .social-event-dot { width: 7px; height: 7px; background: var(--flamingo-deep); flex-shrink: 0; }
  .social-event-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .day-note { padding: 6px 10px; display: flex; align-items: flex-start; gap: 6px; background: #FFF0E0; border-bottom: 2px solid var(--ink); }
  .day-note-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; }
  .day-note-text { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.4; }
  .desk-list { padding: 8px; flex: 1; }
  .desk-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; cursor: pointer; transition: background 110ms; min-height: 34px; position: relative; }
  .desk-row:hover:not(.taken):not(.pending) { background: var(--flamingo-soft); }
  .desk-row.taken { cursor: default; background: var(--taken); }
  .desk-row.taken:hover { background: var(--taken); }
  .desk-row.mine { background: var(--flamingo); }
  .desk-row.mine:hover { background: var(--flamingo-deep); }
  .desk-row.pending { opacity: 0.6; cursor: default; background: var(--flamingo-soft); }
  .desk-num { font-size: 12px; font-weight: 800; color: var(--n-400); width: 20px; flex-shrink: 0; text-align: center; }
  .desk-row.taken .desk-num { color: var(--n-500); }
  .desk-row.mine .desk-num { color: var(--ink); }
  .desk-name { font-size: 14px; font-weight: 600; color: var(--taken-text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desk-row:not(.taken):not(.mine):not(.pending) .desk-name { color: var(--text-faint); font-weight: 500; font-style: italic; }
  .desk-row.mine .desk-name { color: var(--ink); font-weight: 700; }
  .desk-row.pending .desk-name { color: var(--ink); font-weight: 600; }
  .cancel-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--clementine); background: var(--flamingo-deep); border: none; cursor: pointer; padding: 3px 6px; opacity: 0; transition: opacity 110ms; }
  .desk-row.mine:hover .cancel-btn { opacity: 1; }
  .overflow-section { margin: 4px 8px 8px; border: 2px solid var(--ink); background: var(--lime-soft); padding: 8px 10px; }
  .overflow-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 5px; }
  .overflow-row { padding: 3px 70px 3px 0; font-size: 13px; font-weight: 500; color: var(--ink); position: relative; }
  .overflow-row.mine { font-weight: 800; }
  .overflow-row:hover .cancel-btn { opacity: 1; }
  .desk-row.taken:hover .admin-cancel-btn { opacity: 1; }
  .cancel-btn.admin-cancel-btn { color: var(--paper); background: var(--ink); }
  .book-btn { width: 100%; padding: 9px; border: 2px solid var(--ink); border-radius: var(--radius-pill); background: none; color: var(--ink); font-family: var(--font); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; transition: background 120ms, color 120ms; margin: 6px 0; }
  .book-btn:hover { border-color: var(--clementine); background: var(--clementine); color: var(--paper); }
  .book-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--n-400); color: var(--n-400); background: none; }
  .desk-row.desk-row-split { align-items: stretch; padding: 0; min-height: 0; cursor: default; }
  .desk-row.desk-row-split:hover { background: none; }
  .desk-row-split .desk-num { align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .desk-halves { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .desk-half { display: flex; align-items: center; gap: 8px; padding: 4px 8px; position: relative; min-height: 17px; }
  .desk-half:first-child { border-bottom: 1px dashed var(--n-400); }
  .desk-half.mine { background: var(--flamingo); }
  .desk-half.taken { background: var(--taken); }
  .desk-half-empty .desk-name { color: var(--text-faint); font-weight: 500; font-style: italic; }
  .desk-half-label { font-size: 9px; font-weight: 800; color: var(--n-400); width: 16px; flex-shrink: 0; text-transform: uppercase; }
  .desk-half.mine .desk-half-label, .desk-half.taken .desk-half-label { color: var(--n-500); }
  .desk-half .desk-name { font-size: 12px; }
  .desk-half .cancel-btn { padding: 2px 5px; font-size: 10px; }
  .desk-half.mine:hover .cancel-btn { opacity: 1; }
  .desk-half.taken:hover .admin-cancel-btn { opacity: 1; }
  .book-section { padding: 0 2px; margin: 6px 0 0; }
  .book-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: 6px; }
  .book-btn-full { margin: 0 0 6px; }
  .book-btn-half-row { display: flex; gap: 6px; }
  .book-btn-half-row .book-btn { margin: 0; flex: 1; padding: 8px 4px; }

  /* Dog feature */
  .day-dogs { font-size: 12px; font-weight: 700; color: var(--clementine); margin-top: 3px; }
  .dog-check { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; margin: 0 0 6px; user-select: none; }
  .dog-check input { width: 15px; height: 15px; accent-color: var(--clementine); cursor: pointer; flex-shrink: 0; margin: 0; }
  .dog-badge { flex-shrink: 0; font-size: 12px; line-height: 16px; padding: 0 3px; margin-left: 2px; background: var(--clementine); border: 2px solid var(--ink); }
  .dog-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 12px; line-height: 1; padding: 3px 4px; background: var(--paper); border: 2px solid var(--n-400); cursor: pointer; filter: grayscale(1); opacity: 0.5; transition: filter 110ms, opacity 110ms, background 110ms, border-color 110ms; }
  .dog-toggle.on { background: var(--clementine); border-color: var(--ink); filter: none; opacity: 1; }
  .dog-toggle:hover { filter: none; opacity: 1; border-color: var(--ink); }
  .desk-row.mine { padding-right: 78px; }
  .desk-row.mine .cancel-btn { right: 40px; }
  .desk-half.mine { padding-right: 66px; }
  .desk-half.mine .cancel-btn { right: 34px; }
  .desk-half .dog-toggle { padding: 1px 3px; font-size: 11px; }
  .overflow-row.mine .cancel-btn { right: 40px; }
  .glass-box-section { margin-top: 44px; }
  .glass-box-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
  .glass-box-header h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; text-transform: uppercase; }
  .glass-box-header span { font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .glass-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .glass-day { background: #FFE9F4; border: 2px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .glass-day-label { font-size: 12px; font-weight: 800; color: var(--ink); text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .glass-slot { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border: 2px solid var(--ink); background: var(--paper); font-size: 12px; }
  .glass-slot.booked { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .glass-slot.mine-booking { background: var(--clementine); border-color: var(--clementine); color: var(--paper); cursor: pointer; }
  .glass-slot.mine-booking:hover { background: var(--clementine-deep); }
  .glass-slot .slot-time { font-weight: 800; font-size: 13px; }
  .glass-slot .slot-who { opacity: 0.9; font-size: 11px; font-weight: 500; }
  .glass-book-form { display: flex; flex-direction: column; gap: 7px; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 4px; }
  .glass-book-form input, .glass-book-form select { border: 1px solid var(--ink); padding: 7px 9px; font-family: var(--font); font-size: 12px; font-weight: 500; background: var(--paper); outline: none; color: var(--text); width: 100%; }
  .glass-book-form input:focus, .glass-book-form select:focus { box-shadow: inset 0 0 0 1px var(--ink); }
  .glass-book-form input::placeholder { color: var(--text-faint); }
  .glass-time-row { display: flex; gap: 6px; align-items: center; }
  .glass-time-row span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); flex-shrink: 0; }
  .glass-time-row select { flex: 1; }
  .invitees-wrap { position: relative; }
  .invitee-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 32px; border: 1px solid var(--ink); padding: 5px 6px; background: var(--paper); cursor: text; }
  .invitee-chip { display: flex; align-items: center; gap: 5px; background: var(--flamingo-soft); border: 1px solid var(--ink); border-radius: var(--radius-pill); padding: 2px 8px 2px 9px; font-size: 11px; color: var(--ink); font-weight: 700; white-space: nowrap; }
  .invitee-chip button { background: none; border: none; cursor: pointer; color: var(--ink); font-size: 13px; line-height: 1; padding: 0; opacity: 0.55; }
  .invitee-chip button:hover { opacity: 1; color: var(--clementine); }
  .invitee-input { border: none !important; outline: none; font-family: var(--font); font-size: 12px; background: transparent; min-width: 80px; flex: 1; color: var(--text); padding: 3px 0 !important; }
  .invitee-input::placeholder { color: var(--text-faint); }
  .invitee-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--paper); border: 2px solid var(--ink); margin-top: 2px; z-index: 100; max-height: 170px; overflow-y: auto; display: none; }
  .invitee-dropdown.open { display: block; }
  .invitee-option { padding: 8px 10px; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; gap: 1px; border-bottom: 1px solid var(--n-200); }
  .invitee-option:last-child { border-bottom: none; }
  .invitee-option:hover { background: var(--flamingo-soft); }
  .invitee-option .opt-name { font-weight: 700; }
  .invitee-option .opt-email { color: var(--text-faint); font-size: 11px; }
  .invitee-option.loading { color: var(--text-faint); font-style: italic; }
  .glass-submit { padding: 9px 12px; background: var(--clementine); color: var(--paper); border: 2px solid var(--clementine); border-radius: var(--radius-pill); font-family: var(--font); font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: background 120ms; width: 100%; }
  .glass-submit:hover { background: var(--clementine-deep); }
  .glass-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .glass-loading { padding: 20px; text-align: center; font-size: 12px; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .glass-embed-label { display: flex; align-items: center; gap: 10px; margin: 32px 0 14px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; }
  .glass-embed-label::after { content: ""; flex: 1; height: 2px; background: var(--ink); }
  .glass-embed-wrap { position: relative; }
  .glass-embed { width: 100%; height: 600px; border: 2px solid var(--ink); display: block; }
  .glass-embed-skeleton { position: absolute; inset: 0; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; background: var(--paper-warm); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); }
  .glass-embed-skeleton span { animation: embed-pulse 1.4s ease-in-out infinite; }
  @keyframes embed-pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .glass-embed-skeleton span { animation: none; } }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--paper); padding: 13px 22px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity 180ms, transform 180ms; pointer-events: none; z-index: 1000; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--clementine); }
  .loading { text-align: center; padding: 44px; color: var(--text-faint); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  /* Confetti canvas */
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  @media (max-width: 900px) { .week-grid, .glass-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .week-grid, .glass-grid { grid-template-columns: 1fr; } .header { grid-template-columns: 1fr; } }
</style>

    /* --- scoped entirely under #app-loader --- */
    #app-loader{
      position:fixed; inset:0; z-index:9999;
      background:#FAF6F3;                     /* opaque ground before the wipe */
      overflow:hidden;
      opacity:1;
      transition:opacity .4s ease;
      -webkit-font-smoothing:antialiased;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    #app-loader.is-hidden{ opacity:0; pointer-events:none; }

    /* full-screen colour wipe — the progress indicator */
    #app-loader .ldr-wipe{
      position:absolute; inset:0;
      background:#FF4100;                      /* clementine field */
      transform:scaleX(0);
      transform-origin:left center;
      animation:ldr-wipe 2.1s cubic-bezier(.66,0,.34,1) .15s forwards;
    }
    @keyframes ldr-wipe{ to{ transform:scaleX(1); } }

    /* logo — centred, pops in once the wipe has covered the screen */
    #app-loader .ldr-logo{
      position:absolute; top:50%; left:50%;
      width:clamp(240px,44vw,460px); height:auto;
      transform:translate(-50%,-50%) scale(0);
      animation:ldr-logo-in .55s cubic-bezier(.2,1.3,.4,1) 1.7s forwards;
    }
    #app-loader .ldr-logo img{ display:block; width:100%; height:auto; }
    @keyframes ldr-logo-in{
      0%{   transform:translate(-50%,-50%) scale(0) rotate(-12deg); }
      70%{  transform:translate(-50%,-50%) scale(1.08) rotate(4deg); }
      100%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    }

    /* confetti layer */
    #app-loader .ldr-confetti{ position:absolute; inset:0; pointer-events:none; }
    #app-loader .cf{
      position:absolute; left:var(--sx); top:100%;
      width:var(--s); height:var(--s);
      margin-left:calc(var(--s) / -2);
      background:var(--c);
      opacity:0;
      transform:translate(0,0) rotate(0) scale(.5);
      will-change:transform,opacity;
      animation:ldr-rise var(--t) linear forwards;
      animation-delay:calc(var(--d) + .9s);
    }
    #app-loader .cf.ci{ border-radius:50%; }
    #app-loader .cf.pill{ height:calc(var(--s) * .5); border-radius:999px; }
    #app-loader .cf.tri{
      background:transparent;
      width:0; height:0; margin-left:calc(var(--s) / -2);
      border-left:calc(var(--s) / 2) solid transparent;
      border-right:calc(var(--s) / 2) solid transparent;
      border-bottom:var(--s) solid var(--c);
    }
    #app-loader .cf.plus{
      background:transparent;
      background-image:linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c));
      background-size:100% 34%,34% 100%;
      background-position:center,center;
      background-repeat:no-repeat;
    }
    /* shoot up fast (decelerate), then fall with weight (accelerate) */
    @keyframes ldr-rise{
      0%{
        transform:translate(0,0) rotate(0) scale(.5);
        opacity:0;
        animation-timing-function:cubic-bezier(.1,.75,.3,1);
      }
      8%{ opacity:1; }
      46%{
        transform:translate(calc(var(--dx) * .4), var(--rise)) rotate(calc(var(--r) * .5)) scale(1);
        opacity:1;
        animation-timing-function:cubic-bezier(.55,0,.85,.45);
      }
      85%{ opacity:1; }
      100%{
        transform:translate(var(--dx), 20vh) rotate(var(--r)) scale(.9);
        opacity:0;
      }
    }

    @media (prefers-reduced-motion: reduce){
      #app-loader .ldr-wipe,
      #app-loader .ldr-logo,
      #app-loader .cf{ animation:none !important; }
      #app-loader .ldr-wipe{ transform:scaleX(1); }         /* static filled field */
      #app-loader .ldr-logo{ transform:translate(-50%,-50%) scale(1); }
      #app-loader .cf{ display:none; }                       /* no confetti motion */
    }

<script>
const WORKER = 'https://tce-oauth.agencytech.workers.dev';
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GLASS_HOURS = [];
for (let h = 8; h < 19; h++) { GLASS_HOURS.push(String(h).padStart(2,'0')+':00'); GLASS_HOURS.push(String(h).padStart(2,'0')+':30'); }

let currentUser = { name:'', email:'', picture:'' };
let currentWeekStart = getMonday(new Date());
let weekCache = {};       // cache: dateStr -> week data
let glassCache = {};      // cache: dateStr -> glass box data
let socialCache = {};     // cache: dateStr -> social events
let prefetchTimer = null;
const inviteeState = {};

function getMonday(d) { const date=new Date(d); const day=date.getDay(); date.setDate(date.getDate()+(day===0?-6:1-day)); date.setHours(0,0,0,0); return date; }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isToday(d) { const t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); }
function formatWeekLabel(m) { const f=new Date(m); f.setDate(f.getDate()+4); return m.getDate()+' '+MONTHS[m.getMonth()]+' – '+f.getDate()+' '+MONTHS[f.getMonth()]+' '+f.getFullYear(); }
function maxWeekStart() { const m=getMonday(new Date()); m.setDate(m.getDate()+21); return m; }
function fmtT(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function escapeHtml(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── HEADER DATE/TIME ───────────────────────────────────────────
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function ordinal(n) { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function renderHeaderDateTime() {
  const now = new Date();
  document.getElementById('headerDate').textContent = `${DAY_NAMES[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]}`;
  document.getElementById('headerTime').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
}

// ── HEADER NOTICES (this week's day notes + social events) ────
function renderHeaderNotices(ws) {
  const container = document.getElementById('headerNotices');
  if (!container) return;
  const data = weekCache[ws];
  const social = socialCache[ws] || {};
  if (!data || !data.days) { container.innerHTML = ''; return; }

  const items = [];
  data.days.forEach((day,i) => {
    const d = new Date(currentWeekStart); d.setDate(d.getDate()+i);
    const label = `${DAYS[i]} ${d.getDate()}`;
    if (day.note && day.note.note) items.push({ label, text: day.note.note });
    (social[day.date]||[]).forEach(ev => items.push({ label, text: ev.title }));
  });

  container.innerHTML = items.map(it =>
    `<div class="header-notice-item"><span class="header-notice-dot"></span><span class="header-notice-day">${escapeHtml(it.label)}</span><span>${escapeHtml(it.text)}</span></div>`
  ).join('');
}

// ── MONTH CALENDAR ───────────────────────────────────────────
let monthCache = null; // { year, month, days: { 'yyyy-MM-dd': {mine:'core'|'overflow'|null, full:bool} } }

async function loadMonthSummary() {
  const now = new Date();
  const monthKey = now.getFullYear() + '-' + now.getMonth();

  // Instant paint: restore last-seen dots from localStorage so the calendar shows
  // populated on reload while fresh data loads in the background.
  if (!monthCache) {
    try {
      const saved = localStorage.getItem('tce_month_' + monthKey);
      if (saved) monthCache = { year: now.getFullYear(), month: now.getMonth(), days: JSON.parse(saved) };
    } catch(e) {}
  }
  renderMonthCalendar();   // paints immediately: skeleton if no cache, else cached dots

  const monthStart = dateStr(new Date(now.getFullYear(), now.getMonth(), 1));
  const result = await api({action:'getMonthSummary', monthStart});
  if (!result || result.error) return;
  monthCache = { year: now.getFullYear(), month: now.getMonth(), days: result.days || {} };
  renderMonthCalendar();
  try { localStorage.setItem('tce_month_' + monthKey, JSON.stringify(result.days || {})); } catch(e) {}
}

function renderMonthCalendar() {
  // Renders immediately even before data arrives — falls back to the current
  // month with no dots (a clean skeleton) when monthCache isn't populated yet.
  const nowD = new Date();
  const year = monthCache ? monthCache.year : nowD.getFullYear();
  const month = monthCache ? monthCache.month : nowD.getMonth();
  const days = monthCache ? monthCache.days : {};
  document.getElementById('monthCalTitle').textContent = MONTHS[month] + ' ' + year;

  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0..Sun=6
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let cells = '';
  for (let i=0; i<startOffset; i++) cells += `<span class="month-cal-cell blank"></span>`;
  for (let day=1; day<=daysInMonth; day++) {
    const d = new Date(year, month, day);
    const info = days[dateStr(d)];
    const cellCls = ['month-cal-cell'];
    if (isToday(d)) cellCls.push('today');
    const dotCls = ['month-cal-dot'];
    if (info && info.mine === 'overflow') dotCls.push('overflow-booked');
    else if (info && info.mine === 'core') dotCls.push('booked');
    else if (info && info.full) dotCls.push('full');
    cells += `<span class="${cellCls.join(' ')}" onclick="goToMonthDay('${dateStr(d)}')"><span class="${dotCls.join(' ')}">${day}</span></span>`;
  }
  document.getElementById('monthCalGrid').innerHTML = cells;
}

// ── HOLIDAYS / BIRTHDAYS / ANNIVERSARIES (this week) ────────────
// All three come from one shared calendar, classified server-side by keyword
// (see getHolidaysThisWeek/classifyCalendarEvent in code.gs).
let holidaysCache = null;
let birthdaysCache = null;
let anniversariesCache = null;

// Each section's collapsed/expanded state persists per-browser (not tied to
// the Google account, so it won't follow someone to a different device) —
// intentional trade-off to avoid a backend round-trip for a UI toggle.
const SECTION_COLLAPSE_KEY = 'tce_section_collapsed';
function getCollapsedSections() {
  try { return JSON.parse(localStorage.getItem(SECTION_COLLAPSE_KEY)) || {}; }
  catch (e) { return {}; }
}
function setSectionCollapsed(key, collapsed) {
  const cur = getCollapsedSections();
  cur[key] = collapsed;
  try { localStorage.setItem(SECTION_COLLAPSE_KEY, JSON.stringify(cur)); } catch (e) {}
}
function toggleHolidaySection(key) {
  const collapsed = !getCollapsedSections()[key];
  setSectionCollapsed(key, collapsed);
  const items = document.querySelector(`.holiday-items[data-section="${key}"]`);
  const title = document.querySelector(`.holidays-title[data-section="${key}"]`);
  if (items) items.classList.toggle('collapsed', collapsed);
  if (title) title.classList.toggle('collapsed', collapsed);
}

async function loadHolidays() {
  const result = await api({ action: 'getHolidays' });
  if (!result || result.error) return;
  holidaysCache = result.holidays || [];
  birthdaysCache = result.birthdays || [];
  anniversariesCache = result.anniversaries || [];
  renderHolidays();
}

function renderHolidays() {
  const container = document.getElementById('holidaysWidget');
  if (!container) return;
  const todayS = dateStr(new Date());

  function dayLabel(dateS) {
    if (dateS === todayS) return 'today';
    const d = new Date(dateS + 'T00:00:00');
    return `${DAY_SHORT[d.getDay()]} ${ordinal(d.getDate())}`;
  }
  function awayLabel(h) {
    if (h.end === todayS) return 'away today';
    if (h.start === todayS) return `away til ${dayLabel(h.end)}`;
    return `away ${dayLabel(h.start)} til ${dayLabel(h.end)}`;
  }
  function upcoming(list) {
    return (list || [])
      .filter(x => x.end >= todayS)
      .sort((a,b) => a.end < b.end ? -1 : a.end > b.end ? 1 : 0);
  }

  const sections = [
    { key: 'away', title: 'Away this week', items: upcoming(holidaysCache), label: awayLabel },
    { key: 'birthdays', title: '🎂 Birthdays this week', items: upcoming(birthdaysCache), label: b => dayLabel(b.end) },
    { key: 'anniversaries', title: '🎉 Work anniversaries this week', items: upcoming(anniversariesCache), label: a => dayLabel(a.end) }
  ].filter(s => s.items.length);

  if (!sections.length) { container.innerHTML = ''; return; }

  const collapsedMap = getCollapsedSections();
  container.innerHTML = sections.map(s => {
    const collapsed = !!collapsedMap[s.key];
    const rows = s.items.map(item =>
      `<div class="holiday-item"><span class="holiday-name">${escapeHtml(item.name)}</span><span class="holiday-until">(${s.label(item)})</span></div>`
    ).join('');
    return `<div class="holidays-section">
      <div class="holidays-title${collapsed ? ' collapsed' : ''}" data-section="${s.key}" onclick="toggleHolidaySection('${s.key}')" role="button" tabindex="0">
        <span class="holidays-chevron">▾</span>${s.title}
      </div>
      <div class="holiday-items${collapsed ? ' collapsed' : ''}" data-section="${s.key}">${rows}</div>
    </div>`;
  }).join('');
}

// ── NAV ──────────────────────────────────────────────────────
document.getElementById('prevWeek').addEventListener('click', () => {
  const p=new Date(currentWeekStart); p.setDate(p.getDate()-7);
  if(p>=getMonday(new Date())){ currentWeekStart=p; refresh(); }
});
document.getElementById('nextWeek').addEventListener('click', () => {
  const n=new Date(currentWeekStart); n.setDate(n.getDate()+7);
  if(n<=maxWeekStart()){ currentWeekStart=n; refresh(); }
});
document.getElementById('todayBtn').addEventListener('click', () => { currentWeekStart=getMonday(new Date()); refresh(); });
document.getElementById('bookWeekBtn').addEventListener('click', bookMyWeek);
document.getElementById('cancelWeekBtn').addEventListener('click', cancelMyWeek);

function updateNavButtons() {
  document.getElementById('prevWeek').disabled = currentWeekStart <= getMonday(new Date());
  document.getElementById('nextWeek').disabled = currentWeekStart >= maxWeekStart();
  document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
}

// ── API ───────────────────────────────────────────────────────
async function api(params) {
  const url = new URL(WORKER + '/api');
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const res = await fetch(url.toString(), { credentials: 'include' });
  if (res.status === 401) { window.location.href = WORKER+'/signout'; return null; }
  return res.json();
}
async function apiPost(body) {
  const res = await fetch(WORKER + '/api', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', body: JSON.stringify(body)
  });
  if (res.status === 401) { window.location.href = WORKER+'/signout'; return null; }
  return res.json();
}

// ── USER ─────────────────────────────────────────────────────
function renderUser(user) {
  currentUser = user;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('userEmail').textContent = user.email;
  const avatar = document.getElementById('userAvatar');
  avatar.innerHTML = '';
  if (user.picture) {
    const img = document.createElement('img');
    img.src = user.picture;
    img.alt = user.name;
    img.onerror = () => { avatar.textContent = user.name ? user.name[0].toUpperCase() : '?'; };
    avatar.appendChild(img);
  } else {
    avatar.textContent = user.name ? user.name[0].toUpperCase() : '?';
  }
}
function signOut() { window.location.href = WORKER + '/signout'; }

// ── LOAD WITH CACHE + DEFERRED GLASS BOX ─────────────────────
function cacheWeekResult(ws, result) {
  weekCache[ws] = { days: result.days };
  socialCache[ws] = {};
  (result.socialEvents || []).forEach(ev => {
    if (!socialCache[ws][ev.date]) socialCache[ws][ev.date] = [];
    socialCache[ws][ev.date].push({ title: ev.title });
  });
}

// Silently re-fetches an already-cached week in the background and only re-renders
// if the data actually changed (e.g. a colleague booked/cancelled since we cached
// it) and we're still looking at that week. Lets navigation feel instant (render
// from cache immediately) while staying eventually consistent, without needing any
// separate "has this week changed" bookkeeping on the backend.
async function revalidateWeek(ws) {
  const result = await api({ action: 'getAll', weekStart: ws });
  if (!result || result.error) return;
  const prevDays = weekCache[ws] ? JSON.stringify(weekCache[ws].days) : null;
  cacheWeekResult(ws, result);
  if (dateStr(currentWeekStart) === ws && JSON.stringify(result.days) !== prevDays) {
    renderWeekFromCache(ws);
  }
}

async function loadAll(awaitGlassBox) {
  const ws = dateStr(currentWeekStart);
  updateNavButtons();

  // If cached, render immediately — instant navigation — then quietly check for changes
  if (weekCache[ws]) {
    renderWeekFromCache(ws);
    const glassPromise = glassCache[ws] ? null : loadGlassBox(ws);
    schedulePrefetch();
    revalidateWeek(ws);
    if (awaitGlassBox && glassPromise) await glassPromise;
    return;
  }

  // Show existing content faded while loading
  const grid = document.getElementById('weekGrid');
  const existing = grid.innerHTML;
  if (existing && !existing.includes('Loading')) {
    grid.querySelectorAll('.day-card').forEach(c => c.classList.add('loading-state'));
  } else {
    grid.innerHTML = '<div class="loading">Loading…</div>';
  }
  document.getElementById('glassGrid').innerHTML = '<div class="glass-loading">Loading calendar…</div>';

  // Fetch desks + social (fast — sheet only)
  const result = await api({ action: 'getAll', weekStart: ws });
  if (!result) return;
  if (result.error) { grid.innerHTML = '<div class="loading">Failed to load.</div>'; return; }

  if (result.prefs) renderUser(result.prefs);
  cacheWeekResult(ws, result);
  renderWeekFromCache(ws);

  // Deferred: load glass box separately (except on first load — see refresh(awaitGlassBox))
  const glassPromise = loadGlassBox(ws);
  schedulePrefetch();
  if (awaitGlassBox) await glassPromise;
}

async function loadGlassBox(ws) {
  if (glassCache[ws]) {
    renderGlassFromCache(ws);
    return;
  }
  const result = await api({ action: 'getGlassBox', weekStart: ws });
  if (!result || result.error) return;
  glassCache[ws] = result.glassBox || {};
  // Only render if still on this week
  if (dateStr(currentWeekStart) === ws) renderGlassFromCache(ws);
}

function prefetchWeek(ws) {
  if (!weekCache[ws]) {
    api({ action: 'getAll', weekStart: ws }).then(result => {
      if (!result || result.error) return;
      cacheWeekResult(ws, result);
    });
  }
  if (!glassCache[ws]) loadGlassBox(ws);
}

function schedulePrefetch() {
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => {
    // Prefetch the next two weeks and previous two weeks (bounded by the booking
    // horizon), so a run of quick arrow-clicks stays covered, not just one click.
    for (let step = 1; step <= 2; step++) {
      const next = new Date(currentWeekStart); next.setDate(next.getDate()+7*step);
      if (next <= maxWeekStart()) prefetchWeek(dateStr(next));

      const prev = new Date(currentWeekStart); prev.setDate(prev.getDate()-7*step);
      if (prev >= getMonday(new Date())) prefetchWeek(dateStr(prev));
    }
  }, 250);
}

const SLOT_LABELS = { full:'Full day', AM:'9–1', PM:'1–5' };

async function bookDesk(date, desk, slot='full', btn=null) {
  const ws = dateStr(currentWeekStart);
  const section = document.getElementById(`booksection-${date}`);
  const dogEl = document.getElementById(`dogcheck-${date}`);
  const dog = dogEl ? dogEl.checked : false;

  if (btn) btn.textContent = 'Booking…';

    toast(result?.error||'Error booking desk', true);
    if (section) section.querySelectorAll('button').forEach(b=>b.disabled=false);
    if (btn) btn.textContent = SLOT_LABELS[slot];
    return;
  }

  // Confetti!
  launchConfetti();

  // Invalidate cache for this week and reload

// Remove a person's booking from the cached week so we can re-render optimistically.
function removeBookingFromCache(ws, date, email) {
  const data = weekCache[ws];
  if (!data || !data.days) return;
  const day = data.days.find(d=>d.date===date);
  if (!day) return;
  day.desks.forEach(dk=>['full','am','pm'].forEach(k=>{ if(dk[k]&&dk[k].email===email) dk[k]=null; }));
  day.overflow = (day.overflow||[]).filter(ov=>ov.email!==email);
}

async function cancelDesk(e, date) {
  e.stopPropagation();
  const ws = dateStr(currentWeekStart);

  // Optimistic: drop my booking from the cache and re-render this week instantly.
  // The network call and reconcile (an overflow booking may be promoted into the
  // freed seat) run in the background without freezing the calendar.
  removeBookingFromCache(ws, date, currentUser.email);
  renderWeekFromCache(ws);

  const result = await apiPost({action:'cancelDesk', date});
  if (!result || result.error) toast(result?.error||'Error cancelling', true);
  else toast('Booking cancelled');
  revalidateWeek(ws); // reconcile to server truth (promotion, or restore on error)
}

async function toggleDog(e, date) {
  e.stopPropagation();
  const btn = e.currentTarget;
  if (btn.dataset.busy) return;
  const ws = dateStr(currentWeekStart);
  const nowOn = !btn.classList.contains('on');

  // Respond instantly and keep working in the background. Only this user's own
  // booking changes, so there's no need to freeze or reload the whole calendar.
  btn.dataset.busy = '1';
  applyDogState(btn, ws, date, nowOn);

  const result = await apiPost({action:'toggleDog', date});
  delete btn.dataset.busy;
  if (!result || result.error) {
    applyDogState(btn, ws, date, !nowOn); // revert
    toast(result?.error||'Error updating dog', true);
  }
}

// Flip the toggle button, the day's header count, and the cached week model together
// so the optimistic change survives a later re-render.
function applyDogState(btn, ws, date, on) {
  btn.classList.toggle('on', on);
  btn.title = on ? 'Bringing your dog — click to remove' : 'Click to bring your dog';
  updateDogCount(date, on ? 1 : -1);
  const data = weekCache[ws];
  if (data && data.days) {
    const day = data.days.find(d=>d.date===date);
    if (day) {
      const email = currentUser.email;
      day.desks.forEach(dk=>['full','am','pm'].forEach(k=>{ if(dk[k]&&dk[k].email===email) dk[k].dog=on; }));
      (day.overflow||[]).forEach(ov=>{ if(ov.email===email) ov.dog=on; });
    }
  }
}

function updateDogCount(date, delta) {
  const card = document.getElementById(`daycard-${date}`);
  if (!card) return;
  const header = card.querySelector('.day-header');
  if (!header) return;
  let el = header.querySelector('.day-dogs');
  const next = Math.max(0, (el ? (parseInt(el.dataset.count,10)||0) : 0) + delta);
  if (next===0) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.className = 'day-dogs'; header.appendChild(el); }
  el.dataset.count = next;
  el.title = `${next} dog${next>1?'s':''} in the office`;
  el.textContent = `🐶 ×${next}`;
}

// ── CONFETTI ──────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colours = ['#FFB6DD','#FF3D0A','#CCF000','#0A0A0A','#FF8FC8','#FFD0E7'];
  const particles = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 100,
    w: 6 + Math.random() * 8,
    h: 3 + Math.random() * 5,
    colour: colours[Math.floor(Math.random() * colours.length)],
    rotation: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 4,
    vy: 2 + Math.random() * 4,
    vr: (Math.random() - 0.5) * 0.2,
    opacity: 1
  }));

  let frame;
  let start = null;
  const duration = 2200;

  function draw(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12; // gravity
      p.rotation += p.vr;
      p.opacity = Math.max(0, 1 - (elapsed / duration) * 1.2);

      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.colour;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });

    if (elapsed < duration) {
      frame = requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  if (frame) cancelAnimationFrame(frame);
  requestAnimationFrame(draw);
}

async function goToMonthDay(ds) {
  const target = new Date(ds + 'T00:00:00');
  let monday = getMonday(target);
  const minWeek = getMonday(new Date());
  const maxWeek = maxWeekStart();
  if (monday < minWeek) monday = minWeek;
  if (monday > maxWeek) monday = maxWeek;
  currentWeekStart = monday;
  await refresh();
  const card = document.getElementById('daycard-' + ds);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('jump-highlight');
    setTimeout(() => card.classList.remove('jump-highlight'), 1500);
  }
}

const LOADER_MIN_MS = 1900;              // let the logo land before fading
const loaderShownAt = Date.now();
let loaderHidden = false;
function hideAppLoader() {
  if (loaderHidden) return;
  loaderHidden = true;
  const el = document.getElementById("app-loader");
  if (!el) return;
  const wait = Math.max(0, LOADER_MIN_MS - (Date.now() - loaderShownAt));
  setTimeout(() => el.classList.add("is-hidden"), wait);
}

// First load only: wait for desks, Glass Box, month calendar AND holidays to all be
// ready before revealing the page, so nothing pops in after the loader animation ends.
Promise.all([
  refresh(true),
  loadMonthSummary(),
  loadHolidays()
]).finally(hideAppLoader);
setTimeout(hideAppLoader, 12000);        // safety backstop — never trap the user
// Reveal the live-calendar embed even if its onload never fires.
setTimeout(function(){ var s=document.getElementById('glassEmbedSkeleton'); if(s) s.remove(); }, 8000);
</script>
</body>
